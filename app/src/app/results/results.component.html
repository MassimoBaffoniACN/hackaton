<div class="results-layout page-layout">
  <div class="results-layout__toolbar">
    <p-button
      label="Carica un'altra bolletta"
      icon="pi pi-upload"
      [outlined]="true"
      (onClick)="onNuovaBolletta()"
      aria-label="Carica un'altra bolletta e torna al passo iniziale"
    />
  </div>

  <div class="results-layout__placeholder" aria-live="polite">
    <i class="pi pi-chart-bar results-layout__placeholder-icon" aria-hidden="true"></i>
    <p class="results-layout__placeholder-text">
      I risultati dell'analisi verranno visualizzati qui.
    </p>
  </div>
</div>
